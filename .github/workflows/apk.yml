name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.11-fix-gps-arrays.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11-fix-gps-arrays-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 1.0.11 — Fix GPS Arrays 400 Error
          body: |
            Versão com correção do erro 400 quando GPS é negado!
            
            **Root Cause Identified:**
            - User reported error 400 started when GPS permission was denied
            - When GPS denied, app falls back to listByCity with city slug
            - Was sending empty arrays [] for priceType and totalPass when filter is "all"
            - Empty arrays cause 400 error in Supabase RPC
            
            **Fix Applied:**
            - Check if arrays are not empty before sending
            - Pass null instead of empty arrays to avoid 400 error
            - Applied to all three fallback paths in places_screen.dart
            
            **Test:**
            - 21/21 tests passing
            - Should fix 400 error when GPS is denied on first use
            - User should allow GPS permission when prompted
            
            **Funcionalidades Anteriores:**
            - Login-First (v1.0.7)
            - Social UI (v1.0.6)
            - Streak Counter
            - Perfil público com calendário
            - Sistema de comentários
            - Sistema de follows
            - 6 novas piscinas (Mooca, Vila Prudente, Sacoma)
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.11-fix-gps-arrays.apk
          target_commitish: main
          make_latest: true
