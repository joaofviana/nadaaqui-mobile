name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.13.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.13-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 0.1.13 — mapa decisão + compose + onboarding
          body: |
            ## Nesta build

            - **Mapa Explorar:** pins, cluster, ficha decisão, localização, filtros
            - **Compose** sem borda quebrada
            - **Onboarding v3** HQ
            - Model Place com rating / presença (após SQL no Supabase)

            ### SQL no Supabase (mapa)
            https://raw.githubusercontent.com/joaofviana/nadaaqui-backend/main/supabase/migrations/20260928020000_map_places_enrich.sql

            Sideload Android.
          files: dist/nadaaqui-0.1.13.apk
          target_commitish: main
          make_latest: true
