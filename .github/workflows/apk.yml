name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.0-supabase-live.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-supabase-live
          name: NadaAqui 1.0.0 — Supabase Live Ready
          body: |
            APK do `main` com Supabase live configurado.
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sessão melhorada com refresh token e logout.
            Sideload no Android.
          files: dist/nadaaqui-1.0.0-supabase-live.apk
          target_commitish: main
          make_latest: true
