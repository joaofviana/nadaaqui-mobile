name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.8-debug-places.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8-debug-places-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 1.0.8 — Debug Places 400 Error
          body: |
            Versão de debugging para investigar erro 400 nas piscinas!
            
            **Debug Changes:**
            - Usando versão simplificada da RPC nearby_places (nearby_places_simple)
            - Removidos temporariamente parâmetros de array (p_price_types, p_total_pass)
            - Removido parâmetro p_bbox
            - Isso deve isolar se o erro 400 está relacionado a arrays
            
            **Backend:**
            - Migration 20260919350000_test_simple_nearby.sql aplicada
            - Função nearby_places_simple criada sem arrays
            - Migration 20260919340000_fix_ambiguous_id aplicada
            - Migration 20260919330000_fix_nearby_places_limits aplicada
            
            **Teste:**
            - 21/21 testes passando
            - Teste no app: abra o mapa → tente carregar piscinas → clique em "Ver todas"
            - Se erro 400 desaparecer, problema está nos arrays
            - Se erro 400 persistir, problema está em outro lugar
            
            **Funcionalidades Anteriores:**
            - Login-First (v1.0.7)
            - Social UI (v1.0.6)
            - Streak Counter
            - Perfil público com calendário
            - Sistema de comentários
            - Sistema de follows
            - 6 novas piscinas (Mooca, Vila Prudente, Sacoma)
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.8-debug-places.apk
          target_commitish: main
          make_latest: true
