name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.10-rollback.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10-rollback-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 1.0.10 — Rollback Places Changes
          body: |
            Versão com rollback completo das mudanças de places!
            
            **Rollback Changes:**
            - Removidas tentativas de aumentar limite de places
            - Restaurada função nearby_places original (default 50, max 100)
            - Restaurada auth logic original (session token)
            - Restaurada API call original com todos os parâmetros
            - Removido código de debugging
            
            **Backend:**
            - Migration 20260919360000_rollback_all_places_changes.sql aplicada
            - Função nearby_places restaurada ao estado original
            - Função nearby_places_simple removida
            - Aplicado via supabase db push
            
            **Mobile:**
            - PlacesRepository sem limit parameter explícito
            - Auth header restaurado para usar session token
            - API Places restaurado com todos os parâmetros originais
            
            **Teste:**
            - 21/21 testes passando
            - App deve voltar ao estado original que funcionava
            - As 6 novas piscinas em Mooca, Vila Prudente, Sacoma continuam disponíveis
            
            **Funcionalidades Anteriores:**
            - Login-First (v1.0.7)
            - Social UI (v1.0.6)
            - Streak Counter
            - Perfil público com calendário
            - Sistema de comentários
            - Sistema de follows
            - 6 novas piscinas (Mooca, Vila Prudente, Sacoma)
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.10-rollback.apk
          target_commitish: main
          make_latest: true
