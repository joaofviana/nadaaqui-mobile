name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.7-login-clubs.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.7-login-clubs-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 0.1.7 — Login + Clubes
          body: |
            ## Nesta versão

            - **Login moderno:** abas Entrar/Criar, mostrar senha, labels, CTA teal
            - **Clubes:** lista, criar clube, detalhe, criar evento, RSVP
            - Onboarding HQ (v2 force)

            ### Clubes no backend
            Aplique a migration no Supabase se ainda não rodou:
            `20260927130000_clubs_events.sql`

            Sideload Android. Desinstale a versão antiga se o onboarding não aparecer.
          files: dist/nadaaqui-0.1.7-login-clubs.apk
          target_commitish: main
          make_latest: true
