name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.3.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3-20260919
          name: NadaAqui 0.1.3 — main live
          body: |
            APK do `main` (pós PRs #12 #13 #14).
            Compose, sessão, feed live, login persistido, sem seed fake.
            Sideload no Android.
          files: dist/nadaaqui-0.1.3.apk
          target_commitish: main
          make_latest: true
