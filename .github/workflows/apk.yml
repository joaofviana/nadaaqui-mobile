name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.2-gamification.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-gamification
          name: NadaAqui 1.0.2 — GymRats Gamification
          body: |
            Nova versão com funcionalidades GymRats implementadas:
            
            **Novidades:**
            - Leaderboard por lugar (rankings de nadadores)
            - Sistema de pontos e níveis gamificado
            - Desafios de natação (challenges)
            - Conquistas e achievements no perfil
            - Tela de composição redesign fitness
            
            **Funcionalidades:**
            - Ranking por piscina com top 3 em ouro/prata/bronze
            - Sistema de pontos: 50pts/sessão, 10pts/100m, 30pts/streak, 20pts/check-in
            - Níveis: Iniciante → Intermediário → Avançado → Expert → Mestre
            - Desafios com diferentes tipos de meta (sessões, metros, minutos)
            - Badges de conquistas dinâmicas
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.2-gamification.apk
          target_commitish: main
          make_latest: true
