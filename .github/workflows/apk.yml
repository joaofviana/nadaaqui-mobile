name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.4-onboarding.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4-onboarding-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 0.1.4 — Onboarding polido
          body: |
            ## O que tem nesta versão

            - **Onboarding 4 telas** (novo): tribo → evolução (card sessão) → ritmo → localização
            - Teal brand, Ken Burns, CTA teal, copy PT-BR
            - Perfil limpo, home carousel, treino dark, feed Clubes/Explorar/Seguindo
            - Logo Dive + Supabase live

            ### Como ver o onboarding de novo
            Desinstale o app ou limpe os dados antes de instalar este APK.

            Sideload Android.
          files: dist/nadaaqui-0.1.4-onboarding.apk
          target_commitish: main
          make_latest: true
