name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.7-login-first.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7-login-first-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 1.0.7 — Login First Working
          body: |
            Versão com login-first funcional e testado!
            
            **Login-First Screen:**
            - App começa na tela de login (não mais no mapa)
            - Implementação correta com Riverpod providers
            - SessionStore agora é ChangeNotifier
            - Router reage automaticamente a mudanças de sessão
            - Redirecionamento funcional: não autenticado → login, autenticado → app
            - Testes passam validando comportamento
            
            **Como funciona:**
            - Usuário abre app → vê tela de login
            - Login com sucesso → redirecionado para /mapa
            - Logout → redirecionado para /entrar
            - Sessão persistida → usuário vai direto para app ao reabrir
            
            **Funcionalidades Sociais (v1.0.6):**
            - Tela de composição redesenhada (Instagram/Twitter style)
            - Sistema de comentários completo
            - Sininho de notificações no feed
            - Sistema de seguir/deixar de seguir
            
            **Funcionalidades Anteriores:**
            - Perfil público com calendário (FITfolio style)
            - Ícone de home no feed (Instagram/X style)
            - 6 novas piscinas (Mooca, Vila Prudente, Sacoma)
            - Tabbar reorganizada (Mapa | Feed | Treino | Perfil)
            - GymRats (leaderboard, pontos, desafios, conquistas)
            - Workout builder
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.7-login-first.apk
          target_commitish: main
          make_latest: true
