name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.10.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.10-${{ steps.timestamp.outputs.ts }}
          name: NadaAqui 0.1.10 — mapa + dias de treino
          body: |
            ## Nesta build

            - **Mapa explorar:** pins por lat/lng (todos os locais)
            - **Treino:** dias da semana no plano + dots no calendário
            - Compose sóbrio, Configurações, Login, Clubes, Legal

            ### SQL no Supabase (se ainda não)
            - `20260927130000_clubs_events.sql`
            - `20260927140000_delete_account.sql`
            - `20260927150000_workout_week_days.sql`

            Sideload Android.
          files: dist/nadaaqui-0.1.10.apk
          target_commitish: main
          make_latest: true
