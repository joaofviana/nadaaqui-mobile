name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbnFhbmFhaW16dGhscXRybWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTUwNDEsImV4cCI6MjEwNTI3MTA0MX0.MaFw-ptUgUWb54NnyFoIsviJNjG-XNldgMM3vdY3ajc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-1.0.6-social.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-social
          name: NadaAqui 1.0.6 — Social Features
          body: |
            Nova versão com funcionalidades sociais completas!
            
            **Tela de Composição Redesenhada:**
            - Design moderno inspirado em Instagram/Twitter
            - AppBar padrão com botão de publicar arredondado
            - Layout limpo: avatar + input de texto
            - Toolbar simplificada (Foto, GIF, Emoji)
            - Loading state durante publicação
            - Better error handling
            
            **Sistema de Comentários:**
            - Tela de comentários completa
            - Modelos de dados para comentários
            - Like e responder em comentários
            - Comentários clicáveis no feed
            
            **Sininho de Notificações:**
            - Ícone de notificações no header do feed
            - Badge indicador para notificações não lidas
            - Placeholder para tela de notificações
            
            **Sistema de Follows:**
            - Botão de seguir/deixar de seguir funcional
            - Atualiza contador de seguidores
            - Feedback visual imediato
            
            **Melhorias Anteriores:**
            - Perfil público com calendário de atividades (FITfolio style)
            - Ícone de home no feed (Instagram/X style)
            - 6 novas piscinas em Mooca, Vila Prudente e Sacoma
            - Tabbar reorganizada (Mapa | Feed | Treino | Perfil)
            - Funcionalidades GymRats (leaderboard, pontos, desafios, conquistas)
            - Workout builder com treinos pré-definidos
            
            Backend Supabase totalmente funcional com migrations aplicadas.
            Sideload no Android.
          files: dist/nadaaqui-1.0.6-social.apk
          target_commitish: main
          make_latest: true
