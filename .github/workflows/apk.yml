name: apk
on:
  workflow_dispatch:
  push:
    branches: [feat/compose-screens]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://hanqanaaimzthlqtrmks.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadaaqui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nadaaqui-0.1.2.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-20260919
          name: NadaAqui 0.1.2 — compose + sessão
          body: |
            APK de teste (feat/compose-screens).
            Compose estilo X, sessão de nado, kudos, perfil.
            Instale por sideload no Android.
          files: dist/nadaaqui-0.1.2.apk
          target_commitish: feat/compose-screens
          make_latest: true
