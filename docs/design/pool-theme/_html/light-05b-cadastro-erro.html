<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  .auth-wrap { padding-top: 48px; }
  .auth-wrap h1 { margin-top: 16px; margin-bottom: 12px; font-size: 48px; }
  .auth-wrap .subtitle { margin-bottom: 40px; }
  .field { border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="phone theme-light">
  <div class="status"><span>23:15</span><div class="right">▮▮▮ ▮ 5G ▮▮ 82%</div></div>
  <div class="auth-wrap">
    <div class="auth-brand" style="margin-top:16px">
      <svg width="72" height="72" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0284C7"/><path d="M12 36c4-6 8-6 12 0s8 6 12 0 8-6 12 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M16 44c3.5-5 7-5 10.5 0s7 5 10.5 0 7-5 10.5 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/><path d="M28 18c0 0 2-6 8-4 4 1.5 4 6 2 8-3 3-8 2-10-4z" fill="#fff"/></svg>
      <div class="wordmark">NadaAqui</div>
    </div>
    <h1>Criar conta</h1>
    <p class="subtitle">Cadastre-se para fazer check-in e seguir lugares para nadar.</p>
    <div class="field">João Silva</div>
    <div class="field">joao@email.com</div>
    <div class="field">••••••••</div>
    <div class="field error">••••••••</div>
    <div class="field-error-msg">As senhas não conferem</div>
    <button class="btn-cta">Criar conta</button>
    <div class="auth-links">
      <a href="#">Já tenho conta</a>
      <a href="#">Voltar</a>
    </div>
  </div>
</div>
</body>
</html>
