<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  .auth-wrap { padding-top: 120px; }
  .auth-wrap h1 { margin-top: 24px; }
</style>
</head>
<body>
<div class="phone theme-dark">
  <div class="status"><span>23:15</span><div class="right">▮▮▮ ▮ 5G ▮▮ 82%</div></div>
  <div class="auth-wrap">
    <div class="auth-brand">
      <svg width="88" height="88" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2DD4BF"/><path d="M12 36c4-6 8-6 12 0s8 6 12 0 8-6 12 0" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/><path d="M16 44c3.5-5 7-5 10.5 0s7 5 10.5 0 7-5 10.5 0" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><path d="M28 18c0 0 2-6 8-4 4 1.5 4 6 2 8-3 3-8 2-10-4z" fill="#000" opacity=".9"/></svg>
      <div class="wordmark">NadaAqui</div>
    </div>
    <h1>Entrar</h1>
    <p class="subtitle">Entre com seu e-mail e senha para continuar.</p>
    <div class="field">joao@email.com</div>
    <div class="field placeholder">••••••••</div>
    <button class="btn-cta">Entrar</button>
    <div class="auth-links">
      <a href="#">Criar conta</a>
      <a href="#">Esqueceu a senha?</a>
      <a href="#">Voltar</a>
    </div>
  </div>
</div>
</body>
</html>
