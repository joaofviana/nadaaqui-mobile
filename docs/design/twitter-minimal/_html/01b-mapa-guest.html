<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="shared.css"/>
<style>
  .map-area {
    position: absolute; inset: 0 0 320px 0;
    background:
      linear-gradient(#e8eef1 1px, transparent 1px),
      linear-gradient(90deg, #e8eef1 1px, transparent 1px),
      #f5f8fa;
    background-size: 80px 80px, 80px 80px, auto;
  }
  .map-area::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120px 40px at 30% 40%, #d4e4d8 0%, transparent 70%),
      radial-gradient(ellipse 180px 50px at 70% 55%, #d8e4f0 0%, transparent 70%),
      linear-gradient(105deg, transparent 48%, #cfd9de 48.5%, #cfd9de 51.5%, transparent 52%),
      linear-gradient(20deg, transparent 60%, #cfd9de 60.5%, #cfd9de 62%, transparent 62.5%);
    opacity: 0.9;
  }
  .label {
    position: absolute; font-size: 22px; color: #8b98a5; font-weight: 500;
  }
  .pin {
    position: absolute;
    width: 56px; height: 56px;
    background: var(--teal);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 4px 12px rgba(13,148,136,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .pin::after {
    content: "";
    width: 18px; height: 12px;
    border: 2.5px solid #fff;
    border-radius: 2px 2px 0 0;
    transform: rotate(45deg);
    margin-top: -2px;
  }
  .pin.sel {
    width: 68px; height: 68px;
    outline: 4px solid #fff;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 148px;
    background: #fff;
    border-top: 1px solid var(--hairline);
    padding: 20px 40px 28px;
  }
  .sheet .handle {
    width: 64px; height: 6px; background: #CFD9DE;
    border-radius: 3px; margin: 0 auto 20px;
  }
  .sheet h2 {
    font-size: 34px; font-weight: 700; letter-spacing: -0.3px;
    margin-bottom: 10px;
  }
  .meta {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-size: 26px; color: var(--muted);
    margin-bottom: 20px;
  }
  .meta .stars { color: var(--text); }
  .meta .stars span { color: #F59E0B; }
  .sheet-cta {
    width: 100%;
    height: 72px;
    background: #fff;
    color: var(--teal);
    border: 2px solid var(--teal);
    border-radius: 999px;
    font-size: 26px;
    font-weight: 700;
  }
  .guest-pill {
    position: absolute;
    top: 24px; right: 32px;
    z-index: 2;
    padding: 12px 22px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border);
    font-size: 22px;
    font-weight: 600;
    color: var(--muted);
    box-shadow: 0 2px 8px rgba(15,20,25,0.06);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>22:19</span>
    <div class="right">▮▮▮ ▮ 5G ▮▮ 78%</div>
  </div>
  <div class="appbar">
    <div class="title">NadaAqui</div>
    <button class="icon" aria-label="Buscar">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0F1419" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </div>
  <div class="chip-row">
    <div class="chip active">Todos</div>
    <div class="chip">Grátis</div>
    <div class="chip">Pago</div>
    <div class="chip">Total Pass</div>
  </div>
  <div class="content">
    <div class="map-area">
      <div class="guest-pill">Convidado</div>
      <span class="label" style="top:18%;left:12%">Vila Mariana</span>
      <span class="label" style="top:42%;left:58%">Paraíso</span>
      <span class="label" style="top:68%;left:22%">Saúde</span>
      <div class="pin" style="top:22%;left:28%"></div>
      <div class="pin sel" style="top:38%;left:48%"></div>
      <div class="pin" style="top:52%;left:22%"></div>
      <div class="pin" style="top:58%;left:68%"></div>
      <div class="pin" style="top:72%;left:42%"></div>
    </div>
    <div class="sheet">
      <div class="handle"></div>
      <h2>Piscina Municipal Vila Mariana</h2>
      <div class="meta">
        <span class="chip-dist gray">450 m</span>
        <span class="badge">Grátis</span>
        <span class="badge teal">Total Pass</span>
        <span class="stars"><span>★</span> 4,6</span>
      </div>
      <button class="sheet-cta">Entrar para fazer check-in</button>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
      Mapa
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Feed
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a7 7 0 0114 0c0 5.5-7 10-7 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
      Check-in
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      Perfil
    </div>
  </nav>
</div>
</body>
</html>
