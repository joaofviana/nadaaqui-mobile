<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="shared.css"/>
<style>
  .success {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 56px 80px;
    text-align: center;
  }
  .check {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 40px;
  }
  .check svg { width: 72px; height: 72px; stroke: #fff; fill: none; stroke-width: 3; }
  h1 {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.8px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .place {
    font-size: 32px;
    color: var(--muted);
    margin-bottom: 56px;
    font-weight: 500;
  }
  .presence {
    font-size: 28px;
    color: var(--text);
    margin-bottom: 48px;
    padding: 0 20px;
  }
  .presence strong { color: var(--teal); font-weight: 700; }
  .toggle-row {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 24px;
    font-size: 28px;
    font-weight: 500;
  }
  .toggle {
    width: 92px; height: 52px;
    background: var(--teal);
    border-radius: 999px;
    position: relative;
    flex-shrink: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 6px; right: 6px;
    width: 40px; height: 40px;
    background: #fff;
    border-radius: 50%;
  }
  .actions {
    width: 100%;
    max-width: 720px;
  }
  .action {
    width: 100%;
    padding: 32px 8px;
    border: 0;
    background: transparent;
    border-bottom: 1px solid var(--hairline);
    font-size: 30px;
    font-weight: 600;
    color: var(--teal);
    text-align: left;
    cursor: pointer;
  }
  .action:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>22:19</span>
    <div class="right">▮▮▮ ▮ 5G ▮▮ 78%</div>
  </div>
  <div class="appbar">
    <div class="title">NadaAqui</div>
  </div>
  <div class="success">
    <div class="check">
      <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <h1>Check-in feito!</h1>
    <p class="place">Piscina Olímpica Ibirapuera</p>
    <p class="presence"><strong>6</strong> pessoas do app estão aqui</p>
    <div class="toggle-row">
      <span>Mostrar meu perfil</span>
      <div class="toggle" role="switch" aria-checked="true"></div>
    </div>
    <div class="actions">
      <button class="action">Ver quem está aqui</button>
      <button class="action">Compartilhar no feed</button>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
      Mapa
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Feed
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a7 7 0 0114 0c0 5.5-7 10-7 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
      Check-in
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      Perfil
    </div>
  </nav>
</div>
</body>
</html>
